name: Release
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  build:
    name: Check version and build package
    # Keep this guard on every job for defense-in-depth in case job dependencies are refactored.
    if: ${{ !github.event.repository.fork && github.repository == 'graphql/graphql-relay-js' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      dist_tag: ${{ steps.metadata.outputs.dist_tag }}
      should_publish: ${{ steps.metadata.outputs.should_publish }}
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: '.node-version'

      - name: Read release metadata
        id: metadata
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          # A prerelease must never take the 'latest' dist-tag.
          case "${version}" in
            *-*) dist_tag='next' ;;
            *) dist_tag='latest' ;;
          esac
          echo "dist_tag=${dist_tag}" >> "${GITHUB_OUTPUT}"

          # Publishing is driven entirely by whether this version is already on
          # npm, so ordinary merges to main are a no-op and re-runs are safe.
          # 'npm view pkg versions' returns a bare string when only one version
          # exists, hence the array coercion.
          versions_json="$(npm view graphql-relay versions --json)"
          if jq -e --arg v "${version}" \
            '(if type == "array" then . else [.] end) | index($v)' \
            > /dev/null <<< "${versions_json}"
          then
            echo "graphql-relay@${version} is already published. Nothing to do."
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "graphql-relay@${version} is not published yet."
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Dependencies
        if: steps.metadata.outputs.should_publish == 'true'
        run: npm ci

      - name: Run tests
        if: steps.metadata.outputs.should_publish == 'true'
        run: npm run test

      - name: Build npm package
        if: steps.metadata.outputs.should_publish == 'true'
        run: npm run build

      - name: Upload npmDist package
        if: steps.metadata.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npmDist
          path: ./npmDist

  publish:
    name: Publish to npm and create release
    needs: build
    # Keep this guard on every job for defense-in-depth in case job dependencies are refactored.
    if: ${{ !github.event.repository.fork && github.repository == 'graphql/graphql-relay-js' && needs.build.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating the tag and GitHub release
      id-token: write # for npm trusted publishing via OIDC
    steps:
      # This job holds the OIDC token, so it deliberately never runs 'npm ci':
      # no dependency lifecycle scripts execute while the token is available.
      # It only publishes the artifact the build job already produced.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with some Node releases. '.node-version' is pinned accordingly.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Download npmDist package
        uses: actions/download-artifact@v4
        with:
          name: npmDist
          path: ./npmDist

      - name: Publish to npm
        working-directory: ./npmDist
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: npm publish --provenance --tag "${DIST_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          tag="v${VERSION}"

          latest_flag='--latest=false'
          if [ "${DIST_TAG}" = 'latest' ]; then
            latest_flag='--latest'
          fi

          # '--target' creates the tag at the commit that was actually built,
          # so a tag can never disagree with what was published.
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --generate-notes \
            "${latest_flag}"
